name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php-version }} + ${{ matrix.dependencies }} + ${{ matrix.variant }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allowed-to-fail }}
    env:
      SYMFONY_REQUIRE: ${{matrix.symfony-require}}

    strategy:
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies: [highest]
        allowed-to-fail: [false]
        symfony-require: ['']
        variant: [normal]
        include:
          - php-version: '8.2'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 6.4.*
            variant: symfony/symfony:"6.4.*"
          - php-version: '8.2'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 7.4.*
            variant: symfony/symfony:"7.4.*"
          - php-version: '8.3'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 6.4.*
            variant: symfony/symfony:"6.4.*"
          - php-version: '8.3'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 7.4.*
            variant: symfony/symfony:"7.4.*"
          - php-version: '8.4'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 6.4.*
            variant: symfony/symfony:"6.4.*"
          - php-version: '8.4'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 7.4.*
            variant: symfony/symfony:"7.4.*"
          - php-version: '8.4'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 8.*
            variant: symfony/symfony:"8.*"
          - php-version: '8.5'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 6.4.*
            variant: symfony/symfony:"6.4.*"
          - php-version: '8.5'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 7.4.*
            variant: symfony/symfony:"7.4.*"
          - php-version: '8.5'
            dependencies: highest
            allowed-to-fail: false
            symfony-require: 8.*
            variant: symfony/symfony:"8.*"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PHP with extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer:v2, flex
      - name: Add PHPUnit matcher
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - name: Install variant
        if: matrix.variant != 'normal' && !startsWith(matrix.variant, 'symfony/symfony')
        run: composer require ${{ matrix.variant }} --no-update
      - name: Install Composer dependencies (${{ matrix.dependencies }})
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - name: Run Tests with coverage
        run: vendor/bin/phpunit -c phpunit.xml.dist --coverage-clover build/logs/clover.xml
      #- name: Send coverage to Codecov
      #  uses: codecov/codecov-action@v4
      #  with:
      #    files: build/logs/clover.xml

  # Single check to require in the branch protection of main: its name does not depend on the matrix
  tests-passed:
    name: Tests passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the result of the jobs
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
