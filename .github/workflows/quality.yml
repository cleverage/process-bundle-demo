name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PHP with extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies (locked)
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - name: Warmup cache
        run: bin/console cache:warmup
      - name: PHPStan
        run: vendor/bin/phpstan --no-progress --memory-limit=1G analyse --error-format=github

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PHP with extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies (locked)
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --diff --dry-run --show-progress=none

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PHP with extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies (locked)
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - name: Rector
        run: vendor/bin/rector --no-progress-bar --dry-run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PHP with extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies (locked)
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - name: Lint the container
        run: bin/console lint:container
      - name: Lint the YAML files
        run: bin/console lint:yaml config --parse-tags
      # The warmers of the bundles check the processes (e.g. the launch forms of the UI bundle). With
      # cleverage/ui-process-bundle 3.5, warming up a cold prod cache fails (cleverage/ui-process-bundle#262): the
      # container is built first without the optional warmers, then the second run executes all of them
      - name: Build the prod container
        run: bin/console cache:warmup --env=prod --no-optional-warmers
      - name: Warm up the prod cache
        run: bin/console cache:warmup --env=prod

  # Single check to require in the branch protection of main: its name does not depend on the matrix
  quality-passed:
    name: Quality passed
    if: always()
    needs: [phpstan, php-cs-fixer, rector, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the result of the jobs
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
