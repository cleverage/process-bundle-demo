# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    _instanceof:
        CleverAge\ProcessBundle\Model\TaskInterface:
            public: true
            shared: false
            tags:
                - { name: monolog.logger, channel: cleverage_process_task }
        CleverAge\ProcessBundle\Transformer\TransformerInterface:
            public: true
            shared: false
            tags:
                - { name: cleverage.transformer }
                - { name: monolog.logger, channel: cleverage_process_transformer }
    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # For cleverage/soap-process-bundle
    app.cleverage_soap_process.client.oorsprong_countryinfo:
        class: CleverAge\SoapProcessBundle\Client\Client
        bind:
            $code: 'oorsprong_countryinfo'
            $wsdl: 'http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso?WSDL'
            $options:
                trace: true
                exceptions: true
                features: !php/const SOAP_SINGLE_ELEMENT_ARRAYS
        tags:
            - { name: cleverage.soap.client }

    # Non-WSDL SOAP client pointing to a closed port: every call fails with a SoapFault.
    # Used by demo.soap.call_failure (cleverage/soap-process-bundle#25).
    app.cleverage_soap_process.client.unreachable:
        class: CleverAge\SoapProcessBundle\Client\Client
        bind:
            $code: 'unreachable'
            $wsdl: null
            $options:
                location: 'http://127.0.0.1:1/soap'
                uri: 'urn:demo'
                exceptions: true
                connection_timeout: 2
        tags:
            - { name: cleverage.soap.client }

    # For cleverage/rest-process-bundle
    app.cleverage_rest_process.client.apicarto_ign:
        class: CleverAge\RestProcessBundle\Client\Client
        bind:
            $code: 'apicarto_ign'
            $uri: 'https://apicarto.ign.fr/api'
        tags:
            - { name: cleverage.rest.client }

    # SOAP clients (non-WSDL mode, urn:demo) on the WireMock service (stubs .docker/wiremock/mappings/soap-*.json).
    # The headers set by `calls` are sent with every call (cleverage/soap-process-bundle#29); the second client
    # does not throw on SOAP faults (exceptions: false, cleverage/soap-process-bundle#32).
    app.cleverage_soap_process.client.wiremock:
        class: CleverAge\SoapProcessBundle\Client\Client
        bind:
            $code: 'wiremock'
            $wsdl: null
            $options:
                location: '%env(string:WIREMOCK_URL)%/soap'
                uri: 'urn:demo'
        calls:
            - [ setSoapHeaders, [ [ !service { class: SoapHeader, arguments: [ 'urn:demo', 'ClientToken', 'from-the-client-definition' ] } ] ] ]
        tags:
            - { name: cleverage.soap.client }

    app.cleverage_soap_process.client.wiremock_no_exceptions:
        class: CleverAge\SoapProcessBundle\Client\Client
        bind:
            $code: 'wiremock_no_exceptions'
            $wsdl: null
            $options:
                location: '%env(string:WIREMOCK_URL)%/soap'
                uri: 'urn:demo'
                exceptions: false
        tags:
            - { name: cleverage.soap.client }

    # REST client on an unresolvable host (.invalid TLD): every request fails with a transport error.
    # Used by demo.rest.transport_error (cleverage/rest-process-bundle#36).
    app.cleverage_rest_process.client.unreachable:
        class: CleverAge\RestProcessBundle\Client\Client
        bind:
            $code: 'unreachable'
            $uri: 'https://unreachable.invalid/api'
        tags:
            - { name: cleverage.rest.client }

    # REST clients on the WireMock service (.docker/wiremock/), used by the demo.wiremock.* processes:
    # the mocked "library" API, and the WireMock admin API (to reset / verify the received requests).
    app.cleverage_rest_process.client.wiremock:
        class: CleverAge\RestProcessBundle\Client\Client
        bind:
            $code: 'wiremock'
            $uri: '%env(string:WIREMOCK_URL)%/api'
        tags:
            - { name: cleverage.rest.client }

    app.cleverage_rest_process.client.wiremock_admin:
        class: CleverAge\RestProcessBundle\Client\Client
        bind:
            $code: 'wiremock_admin'
            $uri: '%env(string:WIREMOCK_URL)%/__admin'
        tags:
            - { name: cleverage.rest.client }

    # For cleverage/cache-process-bundle
    app.cleverage_cache_process.adapter.memory:
        class: App\Adapter\MemoryAdapter
        tags:
            - { name: cleverage.cache.adapter }
