clever_age_process:
    configurations:
        demo.wiremock.get_json:
            description: >
                WireMock: GET a static JSON response, read from a body file (.docker/wiremock/mappings/books-list.json,
                __files/books.json), decode it and iterate over the books
            help: >
                Ex: bin/console cleverage:process:execute demo.wiremock.get_json
            tasks:
                request:
                    task: rest_request
                    options:
                        client: wiremock
                        url: '/books'
                        method: 'GET'
                    outputs: [ decode ]

                decode:
                    task: transformer
                    options:
                        transformers:
                            json_decode: ~
                    outputs: [ iterate ]

                iterate:
                    task: input_iterator
                    outputs: [ debug ]

                debug:
                    task: debug
