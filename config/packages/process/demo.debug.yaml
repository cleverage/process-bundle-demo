clever_age_process:
    configurations:
        demo.debug:
            description: >
                A simple process which output as debug
            help: >
                Ex: bin/console cleverage:process:execute demo.debug
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_output
                    options:
                        output:
                            id: 123
                            firstname: Test1
                            lastname: Test2
                    outputs: [debug]

                debug:
                    task: debug
