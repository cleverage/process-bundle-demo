clever_age_process:
    configurations:
        demo.transformer.trim_multibyte:
            description: >
                trim transformer with multibyte characters in its charlist (5.7, mb_trim()): "« Bonjour »" gives
                "Bonjour" (trim() removed bytes, cutting the characters sharing them).
            help: >
                Ex: bin/console cleverage:process:execute demo.transformer.trim_multibyte -vv
            tasks:
                entry:
                    task: constant_iterable_output
                    options:
                        output: ['« Bonjour »', 'été']
                    outputs: [trim]
                trim:
                    task: transformer
                    options:
                        transformers:
                            trim:
                                charlist: '« »é'
                    outputs: [debug]
                debug:
                    task: debug
