clever_age_process:
    configurations:
        demo.doctrine.entitymanager.remover_null_input:
            description: >
                DoctrineRemoverTask receiving a null input (cleverage/doctrine-process-bundle#35): the task must fail
                with an explicit message
            help: >
                Ex: bin/console cleverage:process:execute demo.doctrine.entitymanager.remover_null_input
            tasks:
                remove:
                    service: '@CleverAge\DoctrineProcessBundle\Task\EntityManager\DoctrineRemoverTask'
