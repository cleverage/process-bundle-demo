clever_age_process:
    configurations:
        demo.ui.execution_user:
            description: >
                The launch form adds the email of the connected user to the process context, under the reserved
                "execution_user" key (cleverage/ui-process-bundle#256, 3.5: a free context pair "execution_user" of
                the form replaced it).
            help: >
                Ex (UI): Process > demo.ui.execution_user > Launch, then submit: the log of the execution says
                "Launched by" the connected user. Adding the context pair "execution_user" / "someone@else" gives a
                validation error on the key.
            options:
                ui:
                    ui_launch_mode: form
            tasks:
                log:
                    task: logger
                    options:
                        level: info
                        message: 'Launched by {{ execution_user }}'
