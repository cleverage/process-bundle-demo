clever_age_process:
    configurations:
        demo.flysystem.fetch_missing_input:
            description: >
                FileFetchTask receiving a missing file with ignore_missing: true, the default
                (cleverage/flysystem-process-bundle#39): the missing file must be skipped, the other ones copied
            help: >
                Ex: bin/console cleverage:process:execute demo.flysystem.fetch_missing_input && ls var/storage/fetch_source var/storage/fetch_destination
            tasks:
                clean:
                    task: constant_output
                    description: Empty both storages
                    options:
                        output:
                            - '%kernel.project_dir%/var/storage/fetch_source'
                            - '%kernel.project_dir%/var/storage/fetch_destination'
                    outputs: [ remove_storages ]

                remove_storages:
                    task: file_remover
                    outputs: [ content ]

                content:
                    task: constant_output
                    options:
                        output: 'Some data'
                    outputs: [ write_0 ]

                write_0:
                    task: file_writer
                    options:
                        filename: '%kernel.project_dir%/var/storage/fetch_source/a.txt'
                    outputs: [ inputs ]

                inputs:
                    task: constant_iterable_output
                    options:
                        output: [ 'missing.txt', 'a.txt' ]
                    outputs: [ task ]

                task:
                    task: flysystem_file_fetch
                    options:
                        source_filesystem: 'local.storage.fetch_source'
                        destination_filesystem: 'local.storage.fetch_destination'
                    outputs: [ debug ]

                debug:
                    task: debug
