clever_age_process:
    configurations:
        demo.cache.set_get:
            description: >
                A simple process which set and get cached values
            help: >
                Ex: bin/console cleverage:process:execute demo.cache.set_get
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                start:
                    task: dummy
                    outputs: [ data, get, get_missing ]

                data:
                    task: constant_iterable_output
                    outputs: [ format ]
                    options:
                        output:
                            - key: 'key1'
                              column1: value1-1
                              column2: value2-1
                              column3: value3-1
                            - key: 'key2'
                              column1: value1-2
                              column2: value2-2
                              column3: value3-2
                            - key: 'key3'
                              column1: ''
                              column2: null
                              column3: value3-3
                format:
                    task: transformer
                    options:
                        transformers:
                            mapping:
                                mapping:
                                    key:
                                        code: '[key]'
                                    value:
                                        code: '.'
                    outputs: [ set ]

                set:
                    task: cache_set
                    options:
                        adapter: 'memory' # key and value are given by the input

                get:
                    task: cache_get
                    options:
                        adapter: 'memory'
                        key: 'key2'
                    outputs: [ debug ]

                get_missing:
                    task: cache_get
                    options:
                        adapter: 'memory'
                        key: 'missing'
                    outputs: [ debug ]

                debug:
                  task: debug
