clever_age_process:
    configurations:
        demo.doctrine.database.update:
            description: >
                A simple process to use DoctrineProcessBundle as database updater
            help: >
                Ex: bin/console cleverage:process:execute demo.doctrine.database.update -c firstname:Paul -c lastname:Durant
            options:
                ui:
                    ui_launch_mode: form
                    source: Bar
                    target: Foo
                    form:
                        context:
                            firstname:
                                default: Steven
                                options: { required: true }
                            lastname:
                                default: King
                                options: { required: true }
                        # Only the declared fields can be set from the UI
                        allow_extra_context: false
            tasks:
                entry:
                    task: doctrine_database_updater
                    options:
                        sql: 'update author set firstname = :firstname, lastname = :lastname'
                        input_as_params: false
                        params:
                            firstname: '{{ firstname }}'
                            lastname: '{{ lastname }}'
                    outputs: [debug]

                debug:
                    task: debug
