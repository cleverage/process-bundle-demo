clever_age_process:
    configurations:
        demo.doctrine.database.read_paginate:
            description: >
                Read the book table by pages of 2 rows with the DatabaseReaderTask `paginate` option.
                Every row must be output once (cleverage/doctrine-process-bundle#30).
            help: >
                Ex: bin/console cleverage:process:execute demo.doctrine.database.read_paginate
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                read:
                    task: doctrine_database_reader
                    options:
                        table: 'book'
                        sql: 'SELECT id FROM book ORDER BY id'
                        paginate: 2
                    outputs: [ids]

                ids:
                    task: transformer
                    options:
                        transformers:
                            array_map:
                                transformers:
                                    property_accessor:
                                        property_path: '[id]'
                            implode:
                                separator: ','
                    outputs: [debug]

                debug:
                    task: debug
