clever_age_process:
    configurations:
        demo.rest.url_parameter_int:
            description: >
                RequestTask with an integer url parameter (cleverage/rest-process-bundle#38): the value must be
                converted to a string
            help: >
                Ex: bin/console cleverage:process:execute demo.rest.url_parameter_int
            tasks:
                request:
                    service: '@CleverAge\RestProcessBundle\Task\RequestTask'
                    options:
                        client: apicarto_ign
                        url: '/codes-postaux/communes/{codePostal}'
                        method: 'GET'
                        url_parameters: { codePostal: 46800 }
                    outputs: [ debug ]

                debug:
                    service: '@CleverAge\ProcessBundle\Task\Debug\DebugTask'
