clever_age_process:
    configurations:
        demo.soap.call_failure:
            description: >
                A failing SOAP call with the `stop` error strategy: the process must fail
                (cleverage/soap-process-bundle#25).
            help: >
                Ex: bin/console cleverage:process:execute demo.soap.call_failure
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_output
                    options:
                        output:
                            sCountryISOCode: 'FR'
                    outputs: [request]

                request:
                    task: soap_request
                    error_strategy: 'stop'
                    options:
                        client: unreachable
                        method: 'FullCountryInfo'
                    outputs: [debug]

                debug:
                    task: debug

        demo.soap.call_failure_skip:
            description: >
                A failing SOAP call with the `skip` error strategy: the error branch must receive the task input
                (cleverage/soap-process-bundle#25).
            help: >
                Ex: bin/console cleverage:process:execute demo.soap.call_failure_skip
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_output
                    options:
                        output:
                            sCountryISOCode: 'FR'
                    outputs: [request]

                request:
                    task: soap_request
                    error_strategy: 'skip'
                    options:
                        client: unreachable
                        method: 'FullCountryInfo'
                    outputs: [debug]
                    error_outputs: [debug_error]

                debug:
                    task: debug

                debug_error:
                    task: debug
