clever_age_process:
    configurations:
        demo.end_point.flushable:
            description: >
                A flushable task as end_point (5.7): the process returns the last output of the simple_batch task, the
                last batch, instead of null.
            help: >
                Ex: bin/console cleverage:process:execute demo.end_point.flushable -t json-stream
                Expected: [7] (batches of 3 of 1 to 7).
            end_point: batch
            tasks:
                entry:
                    task: constant_iterable_output
                    options:
                        output: [1, 2, 3, 4, 5, 6, 7]
                    outputs: [batch]
                batch:
                    task: simple_batch
                    options:
                        batch_count: 3
