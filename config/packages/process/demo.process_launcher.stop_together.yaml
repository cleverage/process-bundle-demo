clever_age_process:
    configurations:
        demo.process_launcher.stop_together:
            description: >
                ProcessLauncherTask: the sub-processes still running when the process fails or is stopped are
                stopped together (5.9, #459): SIGTERM to all of them, then SIGKILL to the ones still running after
                5 seconds, whatever their number (they were stopped one after the other, up to 5 seconds each: 40
                seconds for 8 sub-processes, more than the grace period of docker stop or Kubernetes). The 4
                sub-processes run a 30 seconds system command, ending only after their current task whatever the
                signal: the process fails on purpose as soon as the fourth one is launched.
            help: >
                Ex: bin/console cleverage:process:execute demo.process_launcher.stop_together -vv
                Expected (requires the pcntl extension, not installed in the php-fpm image: docker-php-ext-install
                pcntl as root; without it a SIGTERM kills the sub-processes at once): the failure of the "fail"
                task, then, about 5 seconds later (4 x 5 = 20 seconds before 5.9), the warning "4 sub-process(es)
                still running at the end of the process have been stopped". The "sleep" commands of the killed
                sub-processes end by themselves.
            tasks:
                values:
                    task: constant_iterable_output
                    options:
                        output: [one, two, three, four]
                    outputs: [launch, last]
                launch:
                    task: process_launcher
                    options:
                        process: demo.process_launcher.stop_together.child
                        max_processes: 4
                        sleep_interval: 0.1
                        sleep_interval_after_launch: 0.1
                        sleep_on_finalize_interval: 0.1
                last: # only the last value goes on to the "fail" task
                    task: filter
                    error_strategy: skip
                    options:
                        match:
                            '': four
                    outputs: [fail]
                fail: # fails on purpose: "four" is not a date (error strategy "stop")
                    task: transformer
                    options:
                        transformers:
                            date_parser:
                                format: 'Y-m-d'

        demo.process_launcher.stop_together.child:
            description: >
                Sub-process of demo.process_launcher.stop_together, waits for a system command sleeping for 30 seconds (a
                SIGTERM only sets the stop flag of the process, it ends after its current task).
            public: false
            entry_point: wait
            tasks:
                wait:
                    task: command_runner
                    options:
                        commandline: [sleep, '30']
