clever_age_process:
    configurations:
        demo.doctrine.entitymanager.detacher_null_input:
            description: >
                DoctrineDetacherTask receiving a null input (cleverage/doctrine-process-bundle#35): the error message
                must name the task
            help: >
                Ex: bin/console cleverage:process:execute demo.doctrine.entitymanager.detacher_null_input
            tasks:
                detach:
                    service: '@CleverAge\DoctrineProcessBundle\Task\EntityManager\DoctrineDetacherTask'
