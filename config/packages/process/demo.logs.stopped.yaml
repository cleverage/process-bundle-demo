clever_age_process:
    configurations:
        demo.logs.stopped:
            description: >
                A process stopped on purpose by a StopTask is not a failure: it logs "Process <code> stopped" at the
                success_level (cleverage/process-bundle#157, #337), here as warning instead of the global
                success_level (info)
            help: >
                Ex: bin/console cleverage:process:execute demo.logs.stopped
                (logs "Process demo.logs.stopped stopped" as WARNING)
            logs:
                success_level: warning
            tasks:
                entry:
                    task: constant_output
                    outputs: [ stop ]
                    options:
                        output: 'value'

                stop:
                    task: stop
