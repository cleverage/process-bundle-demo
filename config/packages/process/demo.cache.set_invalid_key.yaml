clever_age_process:
    configurations:
        demo.cache.set_invalid_key:
            description: >
                SetTask with a key containing a PSR-6 reserved character (cleverage/cache-process-bundle#30): the key is
                rejected by the task, also with --no-debug / in production (Symfony adapters only validate keys with
                assert())
            help: >
                Ex: bin/console cleverage:process:execute demo.cache.set_invalid_key
            tasks:
                item:
                    service: '@CleverAge\ProcessBundle\Task\ConstantOutputTask'
                    options:
                        output:
                            key: 'ABC/001'
                            value: 'value1'
                    outputs: [ set ]

                set:
                    service: '@CleverAge\CacheProcessBundle\Task\SetTask'
                    options:
                        adapter: 'memory' # key and value are given by the input
