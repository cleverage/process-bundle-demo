clever_age_process:
    configurations:
        demo.doctrine.entitymanager.batch_writer:
            description: >
                A simple process to use DoctrineProcessBundle as entity batch_writer
            help: >
                Ex: bin/console cleverage:process:execute demo.doctrine.entitymanager.batch_writer
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_iterable_output
                    options:
                        output:
                            - author1:
                                firstname: Firstname 1
                                lastname: Lastname
                            - author2:
                                firstname: Firstname 2
                                lastname: Lastname
                            - author3:
                                firstname: Firstname 3
                                lastname: Lastname
                    outputs: [iterate]
                iterate:
                    task: input_iterator
                    outputs: [denormalizer]
                denormalizer:
                    task: denormalizer
                    options:
                        class: App\Entity\Author
                    outputs: [batch_write]
                batch_write:
                    task: doctrine_batch_writer
                    outputs: [aggregate_write]
                    options:
                        batch_count: 2
                aggregate_write:
                    task: aggregate_iterable
                    outputs: [fetch]
                fetch:
                    task: doctrine_reader
                    options:
                        class_name: 'App\Entity\Author'
                        criteria:
                            lastname: 'Lastname'
                    outputs: [agregate_fetch]
                agregate_fetch:
                    task: aggregate_iterable
                    outputs: [dump]
                dump:
                    task: debug