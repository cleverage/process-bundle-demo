clever_age_process:
    configurations:
        demo.upload_and_run:
            description: >
                A simple process which upload a csv file and read it to log/debug each line
            help: >
                Ex: bin/console cleverage:process:execute demo.upload_and_run --input=/path/to/file.csv -c delimiter:";"
            entry_point: entrypoint # for upload_and_run process entry_point is required
            options:
                ui:
                    ui_launch_mode: form
                    source: Foo
                    target: Bar
                    form:
                        input:
                            type: Symfony\Component\Form\Extension\Core\Type\FileType
                            options:
                                constraints:
                                    - File:
                                          # A CSV file is often detected as "text/plain": allow it explicitly
                                          extensions:
                                              csv: ['text/csv', 'text/plain', 'application/csv', 'text/x-csv', 'text/x-comma-separated-values']
                        context:
                            # Injected in the "delimiter" option of the CSV reader ({{ delimiter }})
                            delimiter:
                                type: Symfony\Component\Form\Extension\Core\Type\ChoiceType
                                default: ','
                                options:
                                    choices: { 'Comma (,)': ',', 'Semicolon (;)': ';' }
                                    required: true
                        allow_extra_context: false
            tasks:
                entrypoint: # Add log info to describe which file is reading
                    task: logger
                    options:
                        message: Read file
                        level: info
                        context: [ 'input' ]
                    outputs: [ read ]
                read:
                    task: input_csv_reader
                    outputs: [ log_line, dump ]
                    options:
                        delimiter: '{{ delimiter }}' ## delimiter is contextualized you must add -c delimiter:";" on console execute
                log_line:
                    task: logger
                    options:
                        message: Read line
                        level: info
                        context: [ 'input' ]
                dump:
                    task: debug
