clever_age_process:
    configurations:
        demo.tasks_edge.advanced_stat_counter:
            description: >
                AdvancedStatCounterTask with show_every=1 on 3 executions: each execution should be logged, with a correct count
            help: >
                Ex: bin/console cleverage:process:execute demo.tasks_edge.advanced_stat_counter -v
            tasks:
                entry:
                    task: constant_iterable_output
                    options:
                        output: [a, b, c]
                    outputs: [ stats ]
                stats:
                    task: advanced_stat_counter
                    options:
                        show_every: 1

        demo.tasks_edge.iterable_batch_null:
            description: >
                IterableBatchTask with batch_count=null: everything is buffered and output one by one on flush
            help: >
                Ex: bin/console cleverage:process:execute demo.tasks_edge.iterable_batch_null
            tasks:
                entry:
                    task: constant_iterable_output
                    options:
                        output: [a, b, c]
                    outputs: [ batch ]
                batch:
                    task: iterable_batch
                    options:
                        batch_count: ~
                    outputs: [ debug ]
                debug:
                    task: debug

        demo.tasks_edge.condition_scalar:
            description: >
                array_filter with a whole-value condition ('' key) on a list of scalars
            help: >
                Ex: bin/console cleverage:process:execute demo.tasks_edge.condition_scalar
            tasks:
                entry:
                    task: constant_output
                    options:
                        output: [a, b]
                    outputs: [ filter ]
                filter:
                    task: transformer
                    options:
                        transformers:
                            array_filter:
                                condition:
                                    match:
                                        '': a
                    outputs: [ debug ]
                debug:
                    task: debug

        demo.tasks_edge.column_aggregator_null:
            description: >
                ColumnAggregatorTask on a row whose column value is null
            help: >
                Ex: bin/console cleverage:process:execute demo.tasks_edge.column_aggregator_null
            tasks:
                entry:
                    task: constant_output
                    options:
                        output: { a: x, b: ~ }
                    outputs: [ aggregate ]
                aggregate:
                    task: column_aggregator
                    options:
                        columns: [a, b]
                    outputs: [ debug ]
                debug:
                    task: debug
