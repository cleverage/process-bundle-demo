clever_age_process:
    configurations:
        demo.file.input_file_reader:
            description: >
                A simple process which read all files from a specific directory to debug content
            help: >
                bin/console cleverage:process:execute demo.file.input_file_reader
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_output
                    options:
                        output: '/var/data'
                    outputs: directory
                directory:
                    task: input_folder_browser
                    options:
                        base_folder_path: '%kernel.project_dir%'
                    outputs: read
                read:
                    task: input_file_reader
                    outputs: debug
                debug:
                    task: debug
