clever_age_process:
    configurations:
        demo.dummy:
            description: >
                A simple process with multiple output
            help: >
                Ex: bin/console cleverage:process:execute demo.dummy
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: dummy
                    outputs: [ output1, output2 ]
                output1:
                    task: constant_output
                    options:
                        output:
                            id: 123
                            firstname: Test1
                            lastname: Test2
                    outputs: [ debug ]
                output2:
                    task: constant_output
                    options:
                        output:
                            id: 456
                            firstname: Test3
                            lastname: Test4
                    outputs: [ debug ]
                debug:
                    task: debug
