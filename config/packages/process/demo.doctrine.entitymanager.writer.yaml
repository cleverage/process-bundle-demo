clever_age_process:
    configurations:
        demo.doctrine.entitymanager.writer:
            description: >
                A simple process to use DoctrineProcessBundle as entity writer
            help: >
                Ex: bin/console cleverage:process:execute demo.doctrine.entitymanager.writer
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_output
                    options:
                        output:
                            firstname: Isaac
                            lastname: Asimov
                    outputs: [denormalize]
                denormalize:
                    task: denormalizer
                    options:
                        class: App\Entity\Author
                    outputs: [save]
                save:
                    task: doctrine_writer
                    outputs: [fetch]
                fetch:
                    task: doctrine_reader
                    options:
                        class_name: 'App\Entity\Author'
                        criteria:
                            lastname: 'Asimov'
                    outputs: [dump]
                dump:
                    task: debug