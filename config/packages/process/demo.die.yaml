clever_age_process:
    configurations:
        demo.die:
            description: >
                A simple process which output as die
            help: >
                Ex: bin/console cleverage:process:execute demo.die
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_output
                    options:
                        output:
                            id: 123
                            firstname: Test1
                            lastname: Test2
                    outputs: [die]

                die:
                    task: die
