clever_age_process:
    configurations:
        demo.doctrine.entitymanager.reader_multiple_inputs:
            description: >
                DoctrineReaderTask receiving several inputs (cleverage/doctrine-process-bundle#33): the query must be
                executed again for each input, every entity being output each time
            help: >
                Ex: bin/console cleverage:process:execute demo.doctrine.entitymanager.reader_multiple_inputs
            tasks:
                inputs:
                    service: '@CleverAge\ProcessBundle\Task\ConstantIterableOutputTask'
                    options:
                        output: [ 'first', 'second', 'third' ]
                    outputs: [ read ]

                read:
                    service: '@CleverAge\DoctrineProcessBundle\Task\EntityManager\DoctrineReaderTask'
                    options:
                        class_name: 'App\Entity\Book'
                    outputs: [ title ]

                title:
                    service: '@CleverAge\ProcessBundle\Task\TransformerTask'
                    options:
                        transformers:
                            property_accessor:
                                property_path: 'title'
                    outputs: [ debug ]

                debug:
                    service: '@CleverAge\ProcessBundle\Task\Debug\DebugTask'
