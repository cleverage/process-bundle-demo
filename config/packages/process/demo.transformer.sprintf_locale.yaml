clever_age_process:
    configurations:
        demo.transformer.sprintf_locale:
            description: >
                Reproduction (audit v3, "to confirm": locale dependency of the transformers): once the application has
                called setlocale() (here with the locale given as input), the "%f" of the sprintf transformer uses the
                decimal separator of the locale (LC_NUMERIC), "%F" does not.
            help: >
                Ex: bin/console cleverage:process:execute demo.transformer.sprintf_locale --input=fr_FR.UTF-8 -vv
                The locale must be installed in the container (the demo image has only C and C.UTF-8: setlocale
                returns false and nothing changes). Expected: "1,50" for "%f" with fr_FR.UTF-8, "1.50" for "%F".
            entry_point: set_locale
            tasks:
                # Same effect as a setlocale(LC_ALL, '<input>') call in the application (kernel boot, listener...)
                set_locale:
                    task: transformer
                    options:
                        transformers:
                            callback:
                                callback: setlocale
                                left_parameters: [ !php/const LC_ALL ]
                    outputs: [ debug, values ]

                values:
                    task: constant_iterable_output
                    options:
                        output: [ 1.5, 1234.5, -0.25 ]
                    outputs: [ format_f, format_upper_f ]

                # Locale-aware
                format_f:
                    task: transformer
                    options:
                        transformers:
                            sprintf:
                                format: 'f: %%.2f'
                    outputs: [ debug ]

                # Locale-independent
                format_upper_f:
                    task: transformer
                    options:
                        transformers:
                            sprintf:
                                format: 'F: %%.2F'
                    outputs: [ debug ]

                debug:
                    task: debug
