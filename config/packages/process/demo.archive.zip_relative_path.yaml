clever_age_process:
    configurations:
        demo.archive.zip_relative_path:
            description: >
                Zip a file given by a path relative to the current directory, without files_base_path. The file must be
                found (cleverage/archive-process-bundle#16).
            help: >
                Ex: bin/console cleverage:process:execute demo.archive.zip_relative_path (from the project directory)
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                zip:
                    service: '@CleverAge\ArchiveProcessBundle\Task\ZipTask'
                    options:
                        filename: '%kernel.project_dir%/var/data/demo_zip_relative_path.zip'
                        files: 'var/data/sample.txt'
                    outputs: [debug]

                debug:
                    service: '@CleverAge\ProcessBundle\Task\Debug\DebugTask'
