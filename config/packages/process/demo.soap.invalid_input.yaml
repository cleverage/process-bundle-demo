clever_age_process:
    configurations:
        demo.soap.invalid_input:
            description: >
                RequestTask receiving a string input (cleverage/soap-process-bundle#33): the task only accepts an
                array or empty input, it must fail with a clear message
            help: >
                Ex: bin/console cleverage:process:execute demo.soap.invalid_input
            tasks:
                input:
                    service: '@CleverAge\ProcessBundle\Task\ConstantOutputTask'
                    options:
                        output: 'GetBook'
                    outputs: [ request ]

                request:
                    service: '@CleverAge\SoapProcessBundle\Task\RequestTask'
                    options:
                        client: wiremock
                        method: 'GetBook'
                    outputs: [ debug ]

                debug:
                    service: '@CleverAge\ProcessBundle\Task\Debug\DebugTask'
