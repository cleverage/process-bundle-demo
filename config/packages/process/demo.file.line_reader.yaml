clever_age_process:
    configurations:
        demo.file.line_reader:
            description: >
                A simple process which read each line of a specific file to extract data from specific offsets
            help: >
                bin/console cleverage:process:execute demo.file.line_reader
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: line_reader
                    options:
                        filename: '%kernel.project_dir%/var/data/sample.txt'
                    outputs: array
                array:
                    task: input_aggregator
                    options:
                        input_codes: { entry: entry }
                    outputs: transform
                transform:
                    task: transformer
                    options:
                        transformers:
                            mapping:
                                mapping:
                                    id:
                                        code: '[entry]'
                                        transformers:
                                            substr:
                                                offset: 0
                                                length: 6
                                            trim: ~
                                    title:
                                        code: '[entry]'
                                        transformers:
                                            substr:
                                                offset: 6
                                                length: 13
                                            trim: ~
                                    description:
                                        code: '[entry]'
                                        transformers:
                                            substr:
                                                offset: 19
                                                length: 20
                                            trim: ~
                    outputs: debug
                debug:
                    task: debug
