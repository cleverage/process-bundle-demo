clever_age_process:
    configurations:
        demo.rest.transport_error:
            description: >
                RequestTask with a transport error (cleverage/rest-process-bundle#36): the error must be logged
                ("REST request failed") and the transport exception thrown
            help: >
                Ex: bin/console cleverage:process:execute demo.rest.transport_error -v
            tasks:
                request:
                    service: '@CleverAge\RestProcessBundle\Task\RequestTask'
                    options:
                        client: unreachable
                        url: '/ping'
                        method: 'GET'
                    outputs: [ debug ]

                debug:
                    service: '@CleverAge\ProcessBundle\Task\Debug\DebugTask'
