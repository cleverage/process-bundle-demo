clever_age_process:
    configurations:
        demo.doctrine.entitymanager.reader_remover:
            description: >
                A simple process to use DoctrineProcessBundle as entity reader (remove the entity and tries to fetch the same entity)
            help: >
                Ex: bin/console cleverage:process:execute demo.doctrine.entitymanager.reader_remover
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: doctrine_reader
                    options:
                        class_name: 'App\Entity\Book'
                        criteria:
                            title: 'Dracula'
                    outputs: [dump]

                dump:
                    task: debug
                    outputs: [remover]

                remover:
                    task: doctrine_remover
                    outputs: [refetch]

                refetch:
                    task: doctrine_reader
                    options:
                        class_name: 'App\Entity\Book'
                        criteria:
                            title: 'Dracula'
                    outputs: [dumpnullid]

                dumpnullid:
                    task: debug
