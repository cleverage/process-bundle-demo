clever_age_process:
    configurations:
        demo.transformer.ignore_missing_non_array_input:
            description: >
                "ignore_missing" of the mapping and property_accessor transformers with an input that is neither an
                array nor an object (null, a scalar): it has no readable property, so its properties are missing
                (cleverage/process-bundle#430, 5.8; a TypeError was thrown before).
            help: >
                Ex: bin/console cleverage:process:execute demo.transformer.ignore_missing_non_array_input -vv
                Expected: the null and scalar inputs give an empty mapping and a null property, the array input gives
                "x" with the index notation; no error.
            tasks:
                inputs:
                    task: constant_iterable_output
                    options:
                        output:
                            - ~
                            - abc
                            - 42
                            - { name: x }
                    outputs: [ mapping_index, mapping_property, property_accessor_index, property_accessor_property ]

                # Index notation ([name]): for an array
                mapping_index:
                    task: transformer
                    error_strategy: skip
                    options:
                        transformers:
                            mapping:
                                ignore_missing: true
                                mapping:
                                    name:
                                        code: '[name]'
                    outputs: [ debug ]

                # Property notation (name): for an object
                mapping_property:
                    task: transformer
                    error_strategy: skip
                    options:
                        transformers:
                            mapping:
                                ignore_missing: true
                                mapping:
                                    name:
                                        code: name
                    outputs: [ debug ]

                property_accessor_index:
                    task: transformer
                    error_strategy: skip
                    options:
                        transformers:
                            property_accessor:
                                property_path: '[name]'
                                ignore_missing: true
                    outputs: [ debug ]

                property_accessor_property:
                    task: transformer
                    error_strategy: skip
                    options:
                        transformers:
                            property_accessor:
                                property_path: name
                                ignore_missing: true
                    outputs: [ debug ]

                debug:
                    task: debug
