clever_age_process:
    configurations:
        demo.blocking.no_direct_iterable_ancestor:
            description: >
                Blocking tasks without a direct iterable ancestor: one after a non-iterable task following an
                iterable one, one without any iterable ancestor. Both are proceeded (former "Known issue" of the
                README: a BlockingTask was not proceeded without a direct IterableTask ancestor)
            help: >
                Ex: bin/console cleverage:process:execute demo.blocking.no_direct_iterable_ancestor
                Expected: two lines, "indirect: [\"item 1\",\"item 2\",\"item 3\"]" and "no iterable: [\"constant\"]"
            tasks:
                iterable:
                    task: constant_iterable_output
                    options:
                        output: [1, 2, 3]
                    outputs: [format]
                format:
                    task: transformer
                    options:
                        transformers:
                            sprintf: { format: 'item %s' }
                    outputs: [indirect_aggregate]
                indirect_aggregate:
                    task: aggregate_iterable
                    outputs: [indirect_dump]
                indirect_dump:
                    task: transformer
                    options:
                        transformers:
                            callback: { callback: json_encode }
                            sprintf: { format: 'indirect: %s' }
                    outputs: [debug]

                constant:
                    task: constant_output
                    options:
                        output: constant
                    outputs: [no_iterable_aggregate]
                no_iterable_aggregate:
                    task: aggregate_iterable
                    outputs: [no_iterable_dump]
                no_iterable_dump:
                    task: transformer
                    options:
                        transformers:
                            callback: { callback: json_encode }
                            sprintf: { format: 'no iterable: %s' }
                    outputs: [debug]

                debug:
                    task: debug
