clever_age_process:
    configurations:
        demo.flysystem.remove_files_input:
            description: >
                RemoveFileTask receiving a list of paths (cleverage/flysystem-process-bundle#41): each file must be
                deleted
            help: >
                Ex: bin/console cleverage:process:execute demo.flysystem.remove_files_input && ls var/storage/fetch_source var/storage/fetch_destination
            tasks:
                clean:
                    service: '@CleverAge\ProcessBundle\Task\ConstantOutputTask'
                    description: Empty both storages
                    options:
                        output:
                            - '%kernel.project_dir%/var/storage/fetch_source'
                            - '%kernel.project_dir%/var/storage/fetch_destination'
                    outputs: [ remove_storages ]

                remove_storages:
                    service: '@CleverAge\ProcessBundle\Task\File\FileRemoverTask'
                    outputs: [ content ]

                content:
                    service: '@CleverAge\ProcessBundle\Task\ConstantOutputTask'
                    options:
                        output: 'Some data'
                    outputs: [ write_0 ]

                write_0:
                    service: '@CleverAge\ProcessBundle\Task\File\FileWriterTask'
                    options:
                        filename: '%kernel.project_dir%/var/storage/fetch_source/a.txt'
                    outputs: [ write_1 ]

                write_1:
                    service: '@CleverAge\ProcessBundle\Task\File\FileWriterTask'
                    options:
                        filename: '%kernel.project_dir%/var/storage/fetch_source/b.txt'
                    outputs: [ inputs ]

                inputs:
                    service: '@CleverAge\ProcessBundle\Task\ConstantIterableOutputTask'
                    options:
                        output: [ [ 'a.txt', 'b.txt' ] ]
                    outputs: [ task ]

                task:
                    service: '@CleverAge\FlysystemProcessBundle\Task\RemoveFileTask'
                    options:
                        filesystem: 'local.storage.fetch_source'
                    outputs: [ debug ]

                debug:
                    service: '@CleverAge\ProcessBundle\Task\Debug\DebugTask'
