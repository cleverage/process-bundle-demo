clever_age_process:
    configurations:
        demo.process_launcher.json_buffering:
            description: >
                ProcessLauncherTask with json_buffering: the end_point output of each sub-process (an array) is written to
                a JSON stream file, whose path is output; a sub-process writing nothing (no end_point) outputs nothing
                (5.5), its empty buffer is removed.
            help: >
                Ex: bin/console cleverage:process:execute demo.process_launcher.json_buffering -vv
                Expected: the content of the buffer of the "with_output" sub-process only ({"value":"with_output"}).
            tasks:
                values:
                    task: constant_iterable_output
                    options:
                        output: [with_output, without_output]
                    outputs: [launch]
                launch:
                    task: process_launcher
                    options:
                        process: demo.process_launcher.json_buffering.child
                        json_buffering: true
                        max_processes: 2
                        sleep_interval: 0.1
                        sleep_interval_after_launch: 0.1
                        sleep_on_finalize_interval: 0.1
                    outputs: [read]
                read:
                    task: json_stream_reader
                    outputs: [debug]
                debug:
                    task: debug

        demo.process_launcher.json_buffering.child:
            description: Sub-process of demo.process_launcher.json_buffering, outputs an array unless its input is "without_output".
            public: false
            entry_point: route
            end_point: wrap
            tasks:
                route:
                    task: filter
                    options:
                        not_match:
                            '': without_output
                    outputs: [wrap]
                wrap:
                    task: transformer
                    options:
                        transformers:
                            wrapper:
                                wrapper_key: value
