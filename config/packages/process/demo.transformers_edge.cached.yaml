clever_age_process:
    configurations:
        demo.transformers_edge.cached:
            description: >
                CachedTransformer on a non-string input converted to string by key_transformers
            help: >
                Ex: bin/console cleverage:process:execute demo.transformers_edge.cached
            tasks:
                extract:
                    task: constant_output
                    options:
                        output: 42
                    outputs: [ transform ]
                transform:
                    task: transformer
                    options:
                        transformers:
                            cached:
                                cache_key: demo_edge
                                key_transformers:
                                    cast:
                                        type: string
                                transformers:
                                    cast:
                                        type: string
                    outputs: [ debug ]
                debug:
                    task: debug
