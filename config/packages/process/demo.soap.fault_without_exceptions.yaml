clever_age_process:
    configurations:
        demo.soap.fault_without_exceptions:
            description: >
                SOAP fault on a client with the exceptions: false option (cleverage/soap-process-bundle#32): the
                call must fail, the SoapFault must not be output as a result
            help: >
                Ex: bin/console cleverage:process:execute demo.soap.fault_without_exceptions
            tasks:
                request:
                    task: soap_request
                    options:
                        client: wiremock_no_exceptions
                        method: 'Fail'
                    outputs: [ debug ]

                debug:
                    task: debug
