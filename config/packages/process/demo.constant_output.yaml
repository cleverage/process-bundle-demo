clever_age_process:
    configurations:
        demo.constant_output:
            description: >
                A simple process which output a constant data
            help: >
                Ex: bin/console cleverage:process:execute demo.constant_output
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_output
                    options:
                        output:
                            id: 123
                            firstname: Test1
                            lastname: Test2
                    outputs: [ debug ]
                debug:
                    task: debug
