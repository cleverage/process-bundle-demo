clever_age_process:
    configurations:
        demo.file.json_stream_reader:
            description: >
                A simple process which read a json file. json_flags is set without JSON_THROW_ON_ERROR (the default), so
                the invalid "error" line of the sample file is skipped instead of failing the process
            help: >
                Ex: bin/console cleverage:process:execute demo.file.json_stream_reader
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: constant_iterable_output
                    outputs: read
                    options:
                        output:
                            file_path: '%kernel.project_dir%/var/data/json_stream_reader.json'
                read:
                    task: json_stream_reader
                    outputs: dump
                    options:
                        spl_file_object_flags: []
                        json_flags: [] # no JSON_THROW_ON_ERROR: invalid lines are skipped
                dump:
                    task: debug
