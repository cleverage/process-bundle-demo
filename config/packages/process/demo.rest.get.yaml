clever_age_process:
    configurations:
        demo.rest.get:
            description: >
                A simple process to use RestProcessBundle with GET method
            help: >
                Ex: bin/console cleverage:process:execute demo.rest.get -c codePostal:"'46800'"
            options:
                ui:
                    ui_launch_mode: form
                    source: Bar
                    target: Foo
                    form:
                        context:
                            codePostal:
                                options:
                                    required: true
                                    constraints:
                                        - NotBlank: ~
                                        - Regex:
                                              pattern: '/^\d{5}$/'
                                              message: 'Le code postal doit être composé de 5 chiffres.'
                        allow_extra_context: false
            tasks:
                entry:
                    task: rest_request
                    error_strategy: 'stop'
                    options:
                        client: apicarto_ign
                        url: '/codes-postaux/communes/{codePostal}'
                        method: 'GET'
                        url_parameters: { codePostal: '{{ codePostal }}' }
                    outputs: [json_decode]
                json_decode:
                    task: transformer
                    options:
                        transformers:
                            json_decode: ~
                    outputs: [dto]
                dto:
                    task: denormalizer
                    options:
                        class: 'App\Dto\Commune[]'
                    outputs: [debug]
                debug:
                    task: debug
