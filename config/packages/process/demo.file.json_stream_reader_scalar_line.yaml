clever_age_process:
    configurations:
        demo.file.json_stream_reader_scalar_line:
            description: >
                Read a JSON stream file whose second line is a scalar (must fail with an explicit error)
            help: >
                Ex: bin/console cleverage:process:execute demo.file.json_stream_reader_scalar_line -vv
            tasks:
                content:
                    task: constant_output
                    outputs: [ write ]
                    options:
                        output: "{\"a\":1}\n42\n"
                write:
                    task: file_writer
                    outputs: [ read ]
                    options:
                        filename: '%kernel.project_dir%/var/data/json_stream_scalar_line.jsonl'
                read:
                    task: json_stream_reader
                    outputs: [ debug ]
                debug:
                    task: debug
