clever_age_process:
    configurations:
        demo.cache.get_on_miss:
            description: >
                Cache-aside with GetTask on_miss: skip (cleverage/cache-process-bundle#31): a missing key sends the
                input to the error outputs, which compute the value and store it. key1 is computed the first time,
                then read from the cache
            help: >
                Ex: bin/console cleverage:process:execute demo.cache.get_on_miss
            tasks:
                keys:
                    task: constant_iterable_output
                    options:
                        output:
                            - key: 'key1'
                            - key: 'key2'
                            - key: 'key1'
                    outputs: [ get ]

                get:
                    task: cache_get
                    options:
                        adapter: 'memory' # key is given by the input
                        on_miss: skip
                    outputs: [ found ]
                    error_outputs: [ compute ]

                found:
                    task: debug

                compute:
                    task: transformer
                    options:
                        transformers:
                            mapping:
                                mapping:
                                    key:
                                        code: '[key]'
                                    value:
                                        code: '[key]'
                                        transformers:
                                            sprintf:
                                                format: 'computed %s'
                    outputs: [ set, computed ]

                set:
                    task: cache_set
                    options:
                        adapter: 'memory' # key and value are given by the input

                computed:
                    task: debug
