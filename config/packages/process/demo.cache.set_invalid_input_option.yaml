clever_age_process:
    configurations:
        demo.cache.set_invalid_input_option:
            description: >
                SetTask receiving an input with an invalid option type (cleverage/cache-process-bundle#23): the input
                values must be validated like the options
            help: >
                Ex: bin/console cleverage:process:execute demo.cache.set_invalid_input_option
            tasks:
                item:
                    service: '@CleverAge\ProcessBundle\Task\ConstantOutputTask'
                    options:
                        output:
                            adapter: 1
                            key: 'key1'
                            value: 'value1'
                    outputs: [ set ]

                set:
                    service: '@CleverAge\CacheProcessBundle\Task\SetTask'
                    options:
                        adapter: 'memory'
                        key: '' # Overridden by the input
                        value: ~ # Overridden by the input
