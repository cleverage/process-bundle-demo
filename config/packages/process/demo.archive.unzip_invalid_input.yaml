clever_age_process:
    configurations:
        demo.archive.unzip_invalid_input:
            description: >
                Send a string (the archive path) to UnzipTask instead of an array. The task must fail with a clear
                message on the input type (cleverage/archive-process-bundle#18).
            help: >
                Ex: bin/console cleverage:process:execute demo.archive.unzip_invalid_input
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                filename:
                    task: constant_output
                    options:
                        output: '%kernel.project_dir%/var/data/archive.zip'
                    outputs: [unzip]

                unzip:
                    task: archive_unzip
                    options:
                        destination: '%kernel.project_dir%/var/data/unzip_archive'
                    outputs: [debug]

                debug:
                    task: debug
