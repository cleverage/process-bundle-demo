clever_age_process:
    configurations:
        demo.archive.unzip:
            description: >
                A sample process to unzip an archive from local storage
            help: >
                bin/console cleverage:process:execute demo.archive.unzip
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                constant:
                    task: constant_output
                    options:
                        output:
                            filename: '%kernel.project_dir%/var/data/archive.zip'
                            destination: '%kernel.project_dir%/var/data/unzip_archive'
                    outputs: entry
                entry:
                    task: archive_unzip
                    outputs: directory
                directory:
                    task: input_folder_browser
                    outputs: debug
                debug:
                    task: debug
