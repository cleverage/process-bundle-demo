clever_age_process:
    configurations:
        demo.cache.get_invalid_input:
            description: >
                GetTask receiving a string input (cleverage/cache-process-bundle#22): the task only accepts an array or
                null input, it must fail with a clear message
            help: >
                Ex: bin/console cleverage:process:execute demo.cache.get_invalid_input
            tasks:
                sku:
                    task: constant_output
                    options:
                        output: 'key1'
                    outputs: [ get ]

                get:
                    task: cache_get
                    options:
                        adapter: 'memory' # key is given by the input
                    outputs: [ debug ]

                debug:
                    task: debug
