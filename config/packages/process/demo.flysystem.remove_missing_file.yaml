clever_age_process:
    configurations:
        demo.flysystem.remove_missing_file:
            description: >
                RemoveFileTask receiving a missing file and a directory (cleverage/flysystem-process-bundle#41):
                run with -v, the missing file must not be logged as deleted
            help: >
                Ex: bin/console cleverage:process:execute demo.flysystem.remove_missing_file && ls var/storage/fetch_source var/storage/fetch_destination
            tasks:
                clean:
                    task: constant_output
                    description: Empty both storages
                    options:
                        output:
                            - '%kernel.project_dir%/var/storage/fetch_source'
                            - '%kernel.project_dir%/var/storage/fetch_destination'
                    outputs: [ remove_storages ]

                remove_storages:
                    task: file_remover
                    outputs: [ content ]

                content:
                    task: constant_output
                    options:
                        output: 'Some data'
                    outputs: [ write_0 ]

                write_0:
                    task: file_writer
                    options:
                        filename: '%kernel.project_dir%/var/storage/fetch_source/a.txt'
                    outputs: [ write_1 ]

                write_1:
                    task: file_writer
                    options:
                        filename: '%kernel.project_dir%/var/storage/fetch_source/dir/b.txt'
                    outputs: [ inputs ]

                inputs:
                    task: constant_iterable_output
                    options:
                        output: [ 'a.txt', 'missing.txt', 'dir' ]
                    outputs: [ task ]

                task:
                    task: flysystem_remove_file
                    options:
                        filesystem: 'local.storage.fetch_source'
                    outputs: [ debug ]

                debug:
                    task: debug
