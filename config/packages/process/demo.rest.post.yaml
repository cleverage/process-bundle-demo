clever_age_process:
    configurations:
        demo.rest.post:
            description: >
                A simple process to use RestProcessBundle with POST method
            help: >
                Ex: bin/console cleverage:process:execute demo.rest.post
            options:
                ui:
                    source: Bar
                    target: Foo
            tasks:
                entry:
                    task: rest_request
                    error_strategy: 'stop'
                    options:
                        client: apicarto_ign
                        url: '/aoc/appellation-viticole'
                        method: 'POST'
                        data:
                            geom:
                                type: "Point"
                                coordinates: [-1.691634,48.104237]
                    outputs: [json_decode]
                json_decode:
                    task: transformer
                    options:
                        transformers:
                            json_decode: ~
                    outputs: [debug]
                debug:
                    task: debug
