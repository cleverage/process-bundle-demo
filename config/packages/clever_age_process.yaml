# Each file of config/packages/process/ defines one or more processes
imports:
    - { resource: process/ }

clever_age_process:
    # Behavior of a task that encounters an error without its own "error_strategy": stop or skip
    default_error_strategy: stop

    # Reusable transformers, referenced by their name in the processes
    # See https://github.com/cleverage/process-bundle/blob/main/docs/reference/03-generic_transformers_definition.md
    generic_transformers:
        uppercase:
            transformers:
                callback:
                    callback: strtoupper
        lowercase:
            transformers:
                callback:
                    callback: strtolower
        json_decode:
            transformers:
                callback:
                    callback: json_decode
                    right_parameters: [ true ] # $associative: When true, JSON objects will be returned as associative arrays
        substr:
            contextual_options:
                offset:
                    required: true
                length:
                    default_is_null: true
            transformers:
                callback:
                    callback: substr
                    right_parameters: [ '{{ offset }}', '{{ length }}' ]
        sleep: # pause for $value seconds (PHP sleep) then pass the value through
            transformers:
                callback:
                    callback: sleep
