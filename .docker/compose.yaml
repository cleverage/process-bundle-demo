x-base-php: &base-php
  build:
    context: php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      PHP_VERSION: ${PHP_VERSION:-8.5}
  env_file: .env
  volumes:
    - ../:/var/www
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    COMPOSER_HOME: /var/www/.composer
    COMPOSER_MEMORY_LIMIT: -1
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
    PHP_IDE_CONFIG: serverName=sandbox_symfony
    XDEBUG_CONFIG: ${XDEBUG_CONFIG:-}

x-base-apache2: &base-apache2
  build:
    context: apache2
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  env_file: .env
  volumes:
    - ../:/var/www
    - ./apache2/conf/apache2.conf:/etc/apache2/sites-available/000-default.conf
  depends_on:
    - php-fpm

x-base-mysql: &base-mysql
  build:
    context: mysql
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      MYSQL_VERSION: ${MYSQL_VERSION:-9.1.0}
  env_file: .env
  volumes:
    - process_bundle_demo_data:/var/lib/mysql
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: app
    MYSQL_USER: app
    MYSQL_PASSWORD: app

x-base-sftp: &base-sftp
  image: atmoz/sftp
  volumes:
    - ./sftp/data:/home/sftp/data
  environment:
    SFTP_USERNAME: ${SFTP_USERNAME:-sftp}
    SFTP_PASSWORD: ${SFTP_PASSWORD:-password}
  command: ${SFTP_USERNAME:-sftp}:${SFTP_PASSWORD:-password}:${UID:-1000}:${GID:-1000}

name: cleverage-process-bundle-demo

services:
  php-fpm:
    <<: *base-php
    tty: true
    depends_on:
      mysql:
        condition: service_healthy

  apache2:
    <<: *base-apache2
    tty: true
    ports:
      - "${HTTP_PORT:-80}:80"

  mysql:
    <<: *base-mysql
    tty: true
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 5s
      retries: 100
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  sftp:
    <<: *base-sftp
    tty: true

  # Same atmoz/sftp image as `sftp`, but with a deliberately short sshd idle
  # timeout (see sftp/short-timeout.sh). Used by demo.sftp_stale_connection to
  # reproduce flysystem-process-bundle issue #24; all other demo.sftp_* processes
  # keep using the normal `sftp` service.
  sftp-short:
    <<: *base-sftp
    tty: true
    volumes:
      - ./sftp/data:/home/sftp/data
      - ./sftp/short-timeout.sh:/etc/sftp.d/short-timeout.sh:ro

  # Mock SFTP server (paramiko) that, after a short idle, injects a stray SFTP
  # packet while keeping the SSH transport open - reproducing the client's SAP
  # server behaviour and thus the VERBATIM issue #24 error
  # ("Expected NET_SFTP_HANDLE or NET_SFTP_STATUS. Got packet type").
  sftp-mock:
    build:
      context: sftp-mock
    tty: true
    volumes:
      - ./sftp/data:/data
    environment:
      SFTP_MOCK_ROOT: /
      SFTP_MOCK_IDLE: "4"

volumes:
  process_bundle_demo_data:
