x-base-sftp: &base-sftp
  image: atmoz/sftp
  volumes:
    - ./sftp/data:/home/sftp/data
  environment:
    SFTP_USERNAME: ${SFTP_USERNAME:-sftp}
    SFTP_PASSWORD: ${SFTP_PASSWORD:-password}
  command: ${SFTP_USERNAME:-sftp}:${SFTP_PASSWORD:-password}:${UID:-1000}:${GID:-1000}

name: cleverage-process-bundle-demo

services:
  php-fpm:
    <<: *base-php
    tty: true
    depends_on:
      # PostgreSQL instead of MySQL (see docs/postgresql.md): comment mysql, uncomment postgres
      mysql:
        condition: service_healthy
      #postgres:
      #  condition: service_healthy

  apache2:
    <<: *base-apache2
    tty: true
    ports:
      - "${HTTP_PORT:-80}:80"

  mysql:
    <<: *base-mysql
    tty: true
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 5s
      retries: 100
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  # PostgreSQL instead of MySQL (see docs/postgresql.md): comment the mysql service above, uncomment this one
  #postgres:
  #  <<: *base-postgres
  #  tty: true
  #  healthcheck:
  #    test: [ "CMD", "pg_isready", "-U", "app", "-d", "app" ]
  #    timeout: 5s
  #    retries: 100
  #  ports:
  #    - "${POSTGRES_PORT:-5432}:5432"

  sftp:
    <<: *base-sftp
    tty: true

  # Same atmoz/sftp image as `sftp`, but with a deliberately short sshd idle
  # timeout (see sftp/short-timeout.sh). Used by demo.sftp_stale_connection to
  # reproduce flysystem-process-bundle issue #24; all other demo.sftp_* processes
  # keep using the normal `sftp` service.
  sftp-short:
    <<: *base-sftp
    tty: true
    volumes:
      - ./sftp/data:/home/sftp/data
      - ./sftp/short-timeout.sh:/etc/sftp.d/short-timeout.sh:ro

  # Mock SFTP server (paramiko) that, after a short idle, injects a stray SFTP
  # packet while keeping the SSH transport open - reproducing the client's SAP
  # server behaviour and thus the VERBATIM issue #24 error
  # ("Expected NET_SFTP_HANDLE or NET_SFTP_STATUS. Got packet type").
  sftp-mock:
    build:
      context: sftp-mock
    tty: true
    volumes:
      - ./sftp/data:/data
    environment:
      SFTP_MOCK_ROOT: /
      SFTP_MOCK_IDLE: "4"

  # WireMock (https://wiremock.org/): mocks the HTTP APIs called by the demo.wiremock.* processes.
  # Stubs are loaded at startup from ./wiremock/mappings (bodies in ./wiremock/__files), response
  # templating is enabled for every stub. Admin UI / API: http://localhost:${WIREMOCK_PORT:-8089}/__admin
  wiremock:
    image: wiremock/wiremock:3.13.2
    tty: true
    volumes:
      - ./wiremock:/home/wiremock
    command: [ "--global-response-templating", "--verbose" ]
    ports:
      - "${WIREMOCK_PORT:-8089}:8080"

volumes:
  process_bundle_demo_data:
